        // Utility: Fisher-Yates Shuffle
        function shuffleArray(arr) {
            const array = [...arr];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let processedWeeksData = {};
        let currentWeek = 1;
        let userAnswers = {};
        let submittedQuestions = {}; // Tracks locked answers per question in Practice Mode
        let mode = "practice";
        let submitted = false;

        const weekSelect = document.getElementById("week-select");
        const modeSelect = document.getElementById("mode-select");
        const resetBtn = document.getElementById("reset-btn");
        const quizContainer = document.getElementById("quiz-container");
        const statTotal = document.getElementById("stat-total");
        const statCompleted = document.getElementById("stat-completed");
        const statScore = document.getElementById("stat-score");
        const headerSubtitle = document.getElementById("header-subtitle");
        const examSubmitContainer = document.getElementById("exam-submit-container");
        const submitExamBtn = document.getElementById("submit-exam-btn");

        // Prepare and shuffle week questions + options
        function prepareWeekData(week) {
            const originalQuestions = weeksDataRaw[week] || [];
            const shuffledQuestions = shuffleArray(originalQuestions);

            processedWeeksData[week] = shuffledQuestions.map(q => {
                const indexedOptions = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
                const shuffledOptions = shuffleArray(indexedOptions);

                let newCorrect;
                if (q.type === "multi") {
                    newCorrect = [];
                    shuffledOptions.forEach((optObj, newIdx) => {
                        if (q.correct.includes(optObj.originalIndex)) {
                            newCorrect.push(newIdx);
                        }
                    });
                } else {
                    newCorrect = shuffledOptions.findIndex(optObj => optObj.originalIndex === q.correct);
                }

                return {
                    ...q,
                    options: shuffledOptions.map(o => o.text),
                    correct: newCorrect
                };
            });
        }

        function init() {
            prepareWeekData(currentWeek);

            weekSelect.addEventListener("change", (e) => {
                currentWeek = parseInt(e.target.value);
                prepareWeekData(currentWeek);
                resetState();
                render();
            });

            modeSelect.addEventListener("change", (e) => {
                mode = e.target.value;
                resetState();
                render();
            });

            resetBtn.addEventListener("click", () => {
                prepareWeekData(currentWeek);
                resetState();
                render();
            });

            submitExamBtn.addEventListener("click", () => {
                submitted = true;
                render();
                alert(`Exam Submitted! Your Score: ${calculateScore()} / ${processedWeeksData[currentWeek].length}`);
            });

            render();
        }

        function resetState() {
            userAnswers[currentWeek] = {};
            submittedQuestions[currentWeek] = {};
            submitted = false;
        }

        function handleSelect(qId, optIdx, isMulti) {
            if (!userAnswers[currentWeek]) userAnswers[currentWeek] = {};
            if (!submittedQuestions[currentWeek]) submittedQuestions[currentWeek] = {};

            // If question is locked in Practice Mode or exam submitted
            if (mode === "practice" && submittedQuestions[currentWeek][qId]) return;
            if (submitted) return;

            const weekAnswers = userAnswers[currentWeek];

            if (isMulti) {
                if (!weekAnswers[qId]) weekAnswers[qId] = [];
                const idx = weekAnswers[qId].indexOf(optIdx);
                if (idx > -1) {
                    weekAnswers[qId].splice(idx, 1);
                } else {
                    weekAnswers[qId].push(optIdx);
                }
            } else {
                weekAnswers[qId] = optIdx;
                // Single choice auto-submits instantly in Practice mode
                if (mode === "practice") {
                    submittedQuestions[currentWeek][qId] = true;
                }
            }
            render();
        }

        function confirmMultiAnswer(qId) {
            if (!submittedQuestions[currentWeek]) submittedQuestions[currentWeek] = {};
            submittedQuestions[currentWeek][qId] = true;
            render();
        }

        function calculateScore() {
            let correctCount = 0;
            const questions = processedWeeksData[currentWeek] || [];
            const weekAnswers = userAnswers[currentWeek] || {};

            questions.forEach(q => {
                const ans = weekAnswers[q.id];
                if (ans !== undefined) {
                    if (q.type === "multi") {
                        if (Array.isArray(ans) && ans.length === q.correct.length && ans.every(val => q.correct.includes(val))) {
                            correctCount++;
                        }
                    } else {
                        if (ans === q.correct) {
                            correctCount++;
                        }
                    }
                }
            });
            return correctCount;
        }

        function render() {
            headerSubtitle.innerText = `Week ${currentWeek} Interactive Practice`;
            const questions = processedWeeksData[currentWeek] || [];
            statTotal.innerText = questions.length;

            const weekAnswers = userAnswers[currentWeek] || {};
            const weekSubmitted = submittedQuestions[currentWeek] || {};

            const answeredCount = Object.keys(weekAnswers).filter(k => {
                const val = weekAnswers[k];
                return Array.isArray(val) ? val.length > 0 : val !== undefined;
            }).length;

            statCompleted.innerText = `${answeredCount}/${questions.length}`;
            const score = calculateScore();

                        ${q.image ? q.image : ''}

                        <div class="space-y-2">
                            ${q.options.map((opt, optIdx) => {
                                let btnClasses = "w-full text-left p-3.5 rounded-lg border transition-all text-sm sm:text-base flex items-center justify-between ";
                                let isSelected = isMulti ? (userAns && userAns.includes(optIdx)) : (userAns === optIdx);

                                    if (isCorrectOpt) {
                                        btnClasses += "bg-emerald-50 border-emerald-500 text-emerald-900 font-medium";
                                    } else if (isSelected) {
                                        btnClasses += "bg-rose-50 border-rose-500 text-rose-900";
                                    } else {
                                        btnClasses += "bg-slate-50 border-slate-200 text-slate-400 opacity-60";
                                    }
                                } else {
                                    if (isSelected) {
                                        btnClasses += "bg-indigo-50 border-indigo-500 text-indigo-900 font-medium ring-2 ring-indigo-200";
                                    } else {
                                        btnClasses += "bg-slate-50 border-slate-200 hover:bg-slate-100 text-slate-700";
                                    }
                                }

                                return `
                                    <button 
                                        onclick="handleSelect(${q.id}, ${optIdx}, ${isMulti})" 
                                        class="${btnClasses}"
                                        ${isQuestionLocked ? "disabled" : ""}
                                    >
                                        <span class="flex items-center gap-2">
                                            ${isMulti ? `<i class="fa-${isSelected ? 'solid fa-square-check text-indigo-600' : 'regular fa-square text-slate-400'}"></i>` : ''}
                                            <strong class="mr-1">${String.fromCharCode(65 + optIdx)}.</strong> ${opt}
                                        </span>
                                    </button>
                                `;
                            }).join("")}
                        </div>

                        ${(mode === "practice" && isMulti && !isQuestionLocked) ? `
                            <div class="pt-2 flex justify-end">
                                <button 
                                    onclick="confirmMultiAnswer(${q.id})" 
                                    class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg font-semibold transition-colors disabled:opacity-50"
                                    ${(!userAns || userAns.length === 0) ? "disabled" : ""}
                                >
                                    Submit Choice(s)
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join("");
        }

        window.onload = init;
    </script>
</body>
</html>
